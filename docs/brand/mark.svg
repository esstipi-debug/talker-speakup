  <!-- waveform: your turn -->
  <g fill="url(#wave)">
    <rect x="39" y="56" width="10" height="24" rx="5" />
    <rect x="57" y="45" width="10" height="46" rx="5" />
    <rect x="75" y="36" width="10" height="64" rx="5" />
    <rect x="93" y="47" width="10" height="42" rx="5" />
    <rect x="111" y="55" width="10" height="26" rx="5" />
