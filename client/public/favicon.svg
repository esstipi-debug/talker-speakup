<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SpeakUp">
  <defs>
    <linearGradient id="ring" x1="11" y1="41" x2="53" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b6cff" />
      <stop offset="46%" stop-color="#b9a6ff" />
      <stop offset="100%" stop-color="#2ee6a6" />
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb35c" />
      <stop offset="100%" stop-color="#8b6cff" />
