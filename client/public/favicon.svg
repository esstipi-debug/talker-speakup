        stroke="url(#ring)" stroke-width="5" stroke-linejoin="round" />

  <g fill="url(#bar)">
    <rect x="20.5" y="23" width="5" height="15" rx="2.5" />
    <rect x="29.5" y="17.5" width="5" height="26" rx="2.5" />
    <rect x="38.5" y="23" width="5" height="15" rx="2.5" />
